name: Feature request / 功能建议
description: Describe a concrete workflow and desired outcome / 描述使用场景和目标
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem / 使用场景与问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior and alternatives / 目标行为与替代方案
    validations:
      required: true
