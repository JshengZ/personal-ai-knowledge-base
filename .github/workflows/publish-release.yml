name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      installer_run:
        description: Successful Build installers run ID to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Verify release assembly regressions
        run: node --test tests/release.test.mjs
      - name: Verify source checks, assemble and publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKB_INSTALLER_RUN: ${{ inputs.installer_run }}
        run: node scripts/publish-release.mjs
