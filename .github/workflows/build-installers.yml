name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: engine
          cache-on-failure: true
      - run: npm ci
      - run: npm run test:versions
      - run: npm run assets
      - name: Build static Windows embedding runtime
        if: matrix.target == 'win'
        run: npm run assets:win-runtime
      - name: Verify short and bounded-long local embedding inputs
        run: node scripts/check-embedding-runtime.mjs
      - run: npm run dist:${{ matrix.target }}
      - run: node scripts/verify-package.mjs ${{ matrix.target }}
      - run: node --test tests/packaged.test.mjs
      - name: Packaged appearance, migration, guide and collections
        env:
          PKB_PACKAGED_APP: ${{ matrix.target == 'win' && format('{0}\release\win-x64\win-unpacked\Personal-Knowledge.exe', github.workspace) || format('{0}/release/mac-x64/mac/个人知识库.app/Contents/MacOS/个人知识库', github.workspace) }}
          PKB_UI_ARTIFACTS: ${{ github.workspace }}/.local/package-storage-screenshots
          PKB_TOUR_ARTIFACTS: ${{ github.workspace }}/.local/package-guide-screenshots
          PKB_COLLECTION_ARTIFACTS: ${{ github.workspace }}/.local/package-collection-screenshots
          PKB_RUNTIME_ARTIFACTS: ${{ github.workspace }}/.local/package-runtime-screenshots
        run: node --test --test-concurrency=1 tests/desktop-storage.test.mjs tests/onboarding.test.mjs tests/collections.test.mjs tests/library-ui.test.mjs
      - run: node scripts/release-info.mjs
      - name: Verify installer source provenance
        run: node --input-type=module -e "import fs from 'node:fs'; const info=JSON.parse(fs.readFileSync('release/BUILD-INFO.json','utf8')); if(info.source_commit!==process.env.GITHUB_SHA) throw new Error('Installer source commit mismatch');"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*/Personal-Knowledge-*.dmg
            release/*/Personal-Knowledge-*.exe
            release/SHA256SUMS.txt
            release/BUILD-INFO.json
