name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: engine
      - run: npm ci
      - name: Prepare local OCR resources
        run: npm run assets -- --small-only
      - run: npm run test:versions
      - run: npm run check
      - run: npm run build:web
      - run: npm run build:desktop
      - run: cargo build --locked --manifest-path engine/Cargo.toml
      - run: npm test
      - name: Desktop loopback ignores corporate proxies
        run: node --test tests/local-http.test.mjs
      - name: Release artifact provenance and integrity
        run: node --test tests/release.test.mjs
      - run: npm run test:integration
      - name: MCP handshake, busy fallback, migration and worker cleanup
        run: npm run test:resilience
      - name: Headless MCP, quiet-time indexing, slow writes and gateway diagnostics
        run: npm run test:runtime
      - name: Desktop storage migration GUI
        run: npm run test:desktop
      - name: Optional first-run guide and replay
        run: npm run test:onboarding
      - name: Library pagination, recoverable failures and runtime controls
        run: npm run test:library
      - name: Named collections, multiselect, adaptive rules and automatic MCP scope
        run: npm run test:collections
