[package]
name = "knowledge-engine"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
http-body = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
globset = "0.4"
jieba-rs = "0.11"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
notify = "8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.6"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinHttp"] }

[build-dependencies]
winresource = "=0.1.34"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
